<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b1a12">
<meta name="description" content="Encontre personal chefs na sua cidade ou gerencie sua carreira de chef.">
<title>Seu Chef em Casa</title>
<link rel="preconnect" href="https://images.unsplash.com" crossorigin>
<style>
:root{--bg:#f7f1e6;--paper:#fffdf8;--ink:#2b1a12;--mut:#7b6657;--line:#e8dccb;--cu:#b8431f;--cu2:#8c3416;--ol:#4a5d3a;--gold:#d9a441;--sh:0 10px 28px -16px rgba(80,50,30,.4);--nav:64px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font:15px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg) radial-gradient(rgba(184,67,31,.06) 1px,transparent 1px) 0 0/18px 18px;min-height:100vh;padding-bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,h4,.serif{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
input,select,textarea{font:inherit;color:var(--ink);width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--cu);box-shadow:0 0 0 3px rgba(184,67,31,.15)}
:focus-visible{outline:3px solid var(--cu);outline-offset:2px}
[hidden]{display:none!important}
.ic{flex:none}
.top{position:sticky;top:0;z-index:40;background:#2b1a12;color:#fbf3e4;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:50%;background:var(--cu);display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.brand b{font:italic 700 19px Georgia,serif;display:block;line-height:1.1}
.brand small{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#e9c98a}
.who .b{padding:8px 14px;font-size:13px}
.wrap{max-width:640px;margin:0 auto;padding:14px}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:12px 20px;border-radius:999px;font-weight:700;font-size:15px;text-align:center}
.b1{background:linear-gradient(135deg,var(--cu),var(--cu2));color:#fff;box-shadow:0 6px 16px rgba(184,67,31,.3)}
.b1.disabled{background:#d8cbb8;color:#8a7968;box-shadow:none;opacity:.65;cursor:not-allowed}
.b2{background:var(--paper);border:1px solid var(--line);color:var(--ink)}
.b3{background:var(--ol);color:#fff}
.b.full{width:100%}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.mut{color:var(--mut)}.c{text-align:center}
.empty{color:var(--mut);text-align:center;padding:22px 10px}
.sec{font:700 12px/1 -apple-system,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--cu);margin:6px 0 10px}
/* seletor de perfil inicial */
.role-box{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.role-card{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:20px 14px;text-align:center;cursor:pointer;transition:.2s}
.role-card:hover{border-color:var(--cu);transform:translateY(-2px)}
.role-card h3{font-size:17px;margin:8px 0 4px;color:var(--cu2)}
.role-card p{font-size:12.5px;color:var(--mut)}
/* hero */
.hero{background:linear-gradient(135deg,#2b1a12,#4a2a1a);color:#fbf3e4;border-radius:22px;padding:22px 20px;margin-bottom:14px;position:relative;overflow:hidden}
.hero h2{font-size:25px;line-height:1.2;margin-bottom:8px}
.hero p{color:#e9d9c0;font-size:14px;margin-bottom:14px;max-width:34ch}
.hero .hat{position:absolute;right:-14px;bottom:-18px;opacity:.12;color:#fff}
/* catálogo compacto profissional */
.catalog-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.catalog-item{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 4px 12px rgba(80,50,30,.06)}
.catalog-img{position:relative;width:100%;padding-top:75%;background:var(--line)}
.catalog-img img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.catalog-info{padding:10px}
.catalog-info b{font-size:13.5px;display:block;margin-bottom:2px}
.catalog-info small{color:var(--mut);font-size:12px}
/* depoimentos / prova social */
.testimonials{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.testimonial-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.testimonial-card p{font-size:13.5px;font-style:italic;margin-bottom:8px}
.testimonial-card small{color:var(--cu2);font-weight:700;display:block}
/* perfil */
.prof{display:flex;gap:18px;align-items:center}
.stats{display:flex;flex:1;justify-content:space-around;text-align:center}
.stats b{display:block;font:700 19px Georgia,serif}.stats small{font-size:12px;color:var(--mut)}
.acts{display:flex;gap:8px;margin:14px 0}.acts .b{flex:1;padding:10px 12px;font-size:14px;min-height:42px}
.tabs2{display:flex;border-top:1px solid var(--line);margin-top:10px}
.tabs2 button{flex:1;padding:12px 0;display:flex;justify-content:center;color:var(--mut);border-top:2px solid transparent;margin-top:-1px}
.tabs2 button.on{color:var(--ink);border-top-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.tile{position:relative;padding-top:100%;background:var(--line);overflow:hidden;cursor:pointer;display:block}
.tile img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
/* cardápio */
.menu h3{text-align:center;font-size:20px;margin:22px 0 10px;color:var(--cu2)}
.menu h3:before,.menu h3:after{content:"";display:inline-block;width:34px;height:1px;background:var(--gold);vertical-align:middle;margin:0 10px}
.mi{padding:10px 4px;border-bottom:1px dotted #cdb89c}
.mi b{font:700 17px Georgia,serif}.mi p{font-style:italic;color:var(--mut);font-size:14px}
/* pedido */
.f{margin-bottom:12px}.f label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.row{display:flex;gap:10px}.row>*{flex:1}
.step{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.step button{width:38px;height:38px;border-radius:50%;background:var(--bg);font-size:20px;font-weight:700}
.sw{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px}
.sw i{width:44px;height:26px;border-radius:99px;background:#d8cbb8;position:relative;flex:none;transition:.2s}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on i{background:var(--ol)}.sw.on i:after{left:21px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:600}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dish{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;background:#fff;border:1.5px solid var(--line);border-radius:14px;margin-bottom:8px}
.dish.on{border-color:var(--cu);background:#fff7f1}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--cu);flex:none;display:grid;place-items:center;color:#fff;font-size:13px;margin-top:2px}
.dish.on .ck{background:var(--cu)}
.dish b{display:block;font:700 16px Georgia,serif}.dish small{color:var(--mut);font-size:13px}
.obar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;align-items:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(80,50,30,.14)}
.obar span{flex:1;font-weight:700}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--nav) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;box-shadow:0 -6px 20px rgba(80,50,30,.08)}
.nav>div{display:flex;width:100%;max-width:640px}
.nav a,.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mut);font-size:11px;font-weight:600;position:relative}
.nav .on{color:var(--cu)}
.nav .plus span{width:44px;height:44px;border-radius:14px;background:var(--cu);color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px rgba(184,67,31,.4)}
.nav .bd{position:absolute;top:6px;left:54%;min-width:18px;height:18px;border-radius:9px;background:#e0245e;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
.nav img{width:26px;height:26px;border-radius:50%;object-fit:cover}
/* chat DM */
.dm{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:420px}
.dmh{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.dmh .t{flex:1;min-width:0}.dmh b{display:block}.dmh small{color:var(--mut);font-size:12px}
.msgs{flex:1;overflow-y:auto;padding:12px 2px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:78%;padding:9px 14px;border-radius:20px;font-size:15px;word-wrap:break-word}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,var(--cu),var(--cu2));color:#fff;border-bottom-right-radius:6px}
.bub.he{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.bub small{display:block;font-size:10.5px;opacity:.7;margin-top:2px}
.bub img{width:140px;height:200px;object-fit:cover;border-radius:12px;margin-bottom:6px}
.note{background:#fff7e0;border:1px solid #efd98f;border-radius:12px;padding:10px 12px;font-size:12.5px;margin:8px 0}
.comp{display:flex;gap:8px;align-items:center;padding-top:8px}
.comp input{border-radius:99px}.comp button{width:46px;height:46px;border-radius:50%;background:var(--cu);color:#fff;display:grid;place-items:center;flex:none}
.conv{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.conv .t{flex:1;min-width:0}.conv small{display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* overlays */
.ov{position:fixed;inset:0;z-index:70;background:rgba(30,18,10,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:86vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.cmt{display:flex;gap:10px;margin-bottom:12px;font-size:14px}.cmt small{color:var(--mut);margin-left:6px}
.cmt button{color:var(--mut);font-size:12px;margin-left:8px}
.seg{display:flex;background:var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:10px 4px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--mut)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 2px 8px rgba(80,50,30,.15)}
.err{color:#b3261e;font-size:13.5px;min-height:20px;margin:6px 0}
.pw{position:relative}.pw button{position:absolute;right:6px;top:6px;width:38px;height:38px;display:grid;place-items:center;color:var(--mut)}
.ag{position:relative;padding-top:100%;background:var(--line);border-radius:10px;overflow:hidden}
.ag img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.ag button{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}
.ghead{display:flex;align-items:center;gap:10px;padding:2px 0 12px}.ghead h2{font-size:21px;flex:1}
.ghead .bk{width:40px;height:40px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;z-index:99;max-width:90%;text-align:center}
@media(min-width:760px){.wrap{max-width:720px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><a href="#/" class="brand" aria-label="Início"><span class="logo" id="logo"></span><span><b>Seu Chef em Casa</b><small>Personal chefs</small></span></a><div class="who" id="who"></div></header>
<main id="view" tabindex="-1"></main>
<nav class="nav" id="nav" aria-label="Principal"></nav>
<div id="ovl" class="ov" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script>
(function(){
'use strict';
const SEED=[
    { 
        id: 'larissa', name: 'Chef Larissa Chaves', email: 'larissa@chef.com',  whatsapp: '48991106355', phone: '4833334444',
        instagram: 'https://instagram.com/larissachaves.chef',
        cities: 'Florianópolis - SC',
        avatar: 'https://images.unsplash.com/photo-1577219491135-ce391730fb2c?w=600&q=80',
        bio: 'Sou Larissa Chaves, Personal Chef especializada em alta gastronomia.\n\nAtendo em sua residência com preparo completo e requinte.',
        dishes: [
            { id: 1, category: 'Entradas', name: 'Bruschettas Trufadas', desc: 'Pão rústico, tomates e azeite trufado.', price: 35 },
            { id: 11, category: 'Pratos Principais', name: 'Filé Mignon ao Molho Madeira', desc: 'Medalhão grelhado com batatas rústicas.', price: 78 }
        ],
        gallery: [
            { id: 101, url: 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600&q=80', caption: 'Jantar exclusivo em Jurerê' },
            { id: 102, url: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=600&q=80', caption: 'Cortes nobres na brasa' }
        ]
    }
];

let DB=JSON.parse(JSON.stringify(SEED)), MSG=[], ME=null, NAME='';
let S={q:'',feedN:6,tab:'posts',cat:'Todos',adm:'pub',auth:'in',first:false,bio:false,last:null,order:{chef:null,dishes:[],adults:2,kids:0,shop:true,clean:true,chips:[],f:{}}};

const $=function(s,r){return (r||document).querySelector(s);};
const esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));};
const norm=function(s){s=String(s||'').toLowerCase();try{s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'')}catch(e){}return s.trim();};

const P={
  home:'<path d="M3 11l9-8 9 8v10a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  cloche:'<path d="M3 18h18M5 18a7 7 0 0114 0M12 8V5"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>',
  msg:'<path d="M21 11.5a8.4 8.4 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.4 8.4 0 01-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.4 8.4 0 013.8-.9h.5a8.5 8.5 0 018 8v.5z"/>',
  send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',
  grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
  menu:'<path d="M7 3v8a2 2 0 002 2v8M5 3v6M9 3v6M17 3c-2 2-3 5-3 8h3v10"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/>',
  pin:'<path d="M12 22s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff:'<path d="M3 3l18 18M10.6 6.1A9.7 9.7 0 0112 6c6 0 10 6 10 6a17 17 0 01-3.2 3.8M6.5 7.5A17 17 0 002 12s4 7 10 7a9.6 9.6 0 004-.9"/>',
  camera:'<path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  wa:'<path d="M21 12a9 9 0 01-13.4 7.8L3 21l1.3-4.4A9 9 0 1121 12z"/><path d="M9 9c0 3.5 3 6 6 6l1.5-1.5-2-1-1 .8c-1-.5-2-1.5-2.5-2.5l.8-1-1-2z"/>'
};

const ic=function(n,s,f){return '<svg class="ic" width="'+(s||22)+'" height="'+(s||22)+'" viewBox="0 0 24 24" fill="'+(f||'none')+'" stroke="'+(f?'none':'currentColor')+'" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(P[n]||'')+'</svg>';};
const hat=function(s){return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 21h10v-3H7zM18.5 8.1A4.5 4.5 0 0012 5a4.5 4.5 0 00-6.5 3.1A3.5 3.5 0 007 15h10a3.5 3.5 0 001.5-6.9z"/></svg>';};
const fb=function(n){return 'data:image/svg+xml,'+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='#b8431f'/><text x='50' y='65' font-size='48' text-anchor='middle' fill='#fff' font-family='Georgia'>"+((String(n||'C').replace(/^Chef\s+/i,'').charAt(0)||'C').toUpperCase())+"</text></svg>");};
window.__fb=function(el){el.onerror=null;el.src=fb(el.getAttribute('data-n'));};
const img=function(s,alt,n,c){return '<img class="'+(c||'')+'" src="'+esc(s||fb(n))+'" alt="'+esc(alt||'')+'" data-n="'+esc(n||'')+'" loading="lazy" decoding="async" onerror="__fb(this)">';};
const money=function(n){return 'R$ '+Number(n||0).toFixed(2).replace('.',',');};

function loadData(){
  try {
    const savedDb = localStorage.getItem('scf3_db');
    if(savedDb){
      const parsed = JSON.parse(savedDb);
      if(Array.isArray(parsed) && parsed.length > 0) DB = parsed;
    }
    const savedMsgs = localStorage.getItem('scf3_msgs');
    if(savedMsgs) MSG = JSON.parse(savedMsgs) || [];
    ME = localStorage.getItem('scf3_me');
    if(ME && !chefById(ME)) ME = null;
    NAME = localStorage.getItem('scf3_name') || '';
  } catch(e){
    DB = JSON.parse(JSON.stringify(SEED));
  }
}

function saveData(){
  try{
    localStorage.setItem('scf3_db', JSON.stringify(DB));
    localStorage.setItem('scf3_msgs', JSON.stringify(MSG));
    if(ME) localStorage.setItem('scf3_me', ME); else localStorage.removeItem('scf3_me');
    return true;
  }catch(e){return false;}
}

const chefById=function(id){return DB.find(c=>c.id===id);};
let tt;
function toast(m){
  const t=$('#toast');
  if(!t)return;
  t.textContent=m;
  t.hidden=false;
  clearTimeout(tt);
  tt=setTimeout(()=>t.hidden=true,3000);
}

const hhmm=function(t){return new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});};

async function hp(p,s){
  try{
    if(window.crypto&&crypto.subtle){
      const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+':'+p));
      return Array.from(new Uint8Array(b)).map(x=>('0'+x.toString(16)).slice(-2)).join('');
    }
  }catch(e){}
  let h=5381,t=s+':'+p;
  for(let i=0;i<t.length;i++) h=((h<<5)+h+t.charCodeAt(i))>>>0;
  return 'x'+h;
}

const compress=function(f,max,q){
  return new Promise((ok,no)=>{
    const r=new FileReader();
    r.onerror=no;
    r.onload=function(){
      const i=new Image();
      i.onerror=no;
      i.onload=function(){
        const k=Math.min(1,max/Math.max(i.width,i.height));
        const c=document.createElement('canvas');
        c.width=Math.round(i.width*k);
        c.height=Math.round(i.height*k);
        c.getContext('2d').drawImage(i,0,0,c.width,c.height);
        ok(c.toDataURL('image/jpeg',q));
      };
      i.src=r.result;
    };
    r.readAsDataURL(f);
  });
};

    const SC_CIDADES = [
      "Florianópolis - SC", "São José - SC", "Palhoça - SC", "Biguaçu - SC",
      "Balneário Camboriú - SC", "Itajaí - SC", "Blumenau - SC", "Joinville - SC",
      "Criciúma - SC", "Chapecó - SC", "Itapema - SC", "Porto Belo - SC",
      "Tubarão - SC", "Araranguá - SC", "Brusque - SC", "Jaraguá do Sul - SC",
      "Lages - SC", "Concórdia - SC", "Rio do Sul - SC", "São Bento do Sul - SC"
    ];
    h+='<div class="card">'+
       '<div class="f"><label for="p_name">Nome</label><input id="p_name" data-p="name" value="'+esc(c.name)+'"></div>'+
       '<div class="f"><label for="p_cities">Cidades onde atende (SC)</label>'+
       '<input id="p_cities" data-p="cities" list="sc-cities" value="'+esc(c.cities)+'" placeholder="Digite ou selecione a cidade">'+
       '<datalist id="sc-cities">'+SC_CIDADES.map(ciu=>'<option value="'+ciu+'">').join('')+'</datalist></div>'+
       '<div class="f"><label for="p_whatsapp">WhatsApp com DDD</label><input id="p_whatsapp" data-p="whatsapp" value="'+esc(c.whatsapp)+'"></div>'+
       '<div class="f"><label for="p_phone">Telefone</label><input id="p_phone" data-p="phone" value="'+esc(c.phone)+'"></div>'+
       '<div class="f"><label for="p_email">E-mail</label><input id="p_email" data-p="email" value="'+esc(c.email)+'"></div>'+
       '<div class="f"><label for="p_instagram">Link do Instagram</label><input id="p_instagram" data-p="instagram" value="'+esc(c.instagram)+'"></div>'+
       '<div class="f"><label for="p_bio">Sua apresentação</label><textarea id="p_bio" data-p="bio" style="min-height:140px">'+esc(c.bio)+'</textarea></div>'+
       '</div>';
  } else {
    h+='<div class="card"><p class="sec">Fotos publicadas ('+c.gallery.length+')</p>'+(c.gallery.length?'<div class="grid" style="gap:8px">'+c.gallery.slice().reverse().map(p=>'<div class="ag">'+img(p.url,'',c.name)+'<button data-a="pdel" data-id="'+p.id+'" aria-label="Excluir foto">'+ic('trash',16)+'</button></div>').join('')+'</div>':'<p class="empty">Nenhuma foto.</p>')+'</div>';
  }
  return h;
}

function route(){
  try {
    const parts=(location.hash.slice(1)||'/').split('/').filter(Boolean), v=parts[0]||'home', a=parts[1];
    let h='', r=v;
    if((v==='painel'||v==='direct')&&!ME){location.replace('#/entrar');return;}
    if(v==='entrar'&&ME){location.replace('#/painel');return;}
    
    if(v==='buscar') h=search();
    else if(v==='chef') h=profile(a);
    else if(v==='pedido') h=order(a);
    else if(v==='chat') h=chat(a);
    else if(v==='entrar') h=auth();
    else if(v==='painel') h=admin();
    else if(v==='direct') h=a?thread(decodeURIComponent(a)):direct();
    else {h=home();r='home';}
    
    const vw=$('#view');
    if(vw) vw.innerHTML='<div class="wrap">'+h+'</div>';
    S.route=r; drawNav(); drawWho();
    
    if(v==='pedido') updateOrderState();
    window.scrollTo(0,0);
    document.title=(v==='chef'&&a&&chefById(a)?chefById(a).name+' — ':'')+'Seu Chef em Casa';
  } catch(err){
    const vw=$('#view');
    if(vw) vw.innerHTML='<div class="wrap"><p class="empty">Ocorreu um erro ao carregar esta página. <a href="#/" style="color:var(--cu)">Voltar ao início</a></p></div>';
  }
}

function drawWho(){
  const w=$('#who');
  if(w) w.innerHTML=ME?'<a class="b b2" href="#/painel">Painel Chef (Logado)</a>':'<a class="b b2" href="#/entrar">Área do Chef</a>';
}

function drawNav(){
  const nav=$('#nav');
  if(!nav)return;
  const r=S.route, l=(DB&&DB[0]?DB[0].id:'larissa'), me=ME&&chefById(ME), n=ME?inboxN():unsentN();
  const it=function(href,i,t,on,extra){return '<a href="'+href+'" class="'+(on?'on':'')+'" aria-label="'+t+'">'+i+'<span>'+t+'</span>'+(extra||'')+'</a>';};
  nav.innerHTML='<div>'+it('#/',ic('home',24),'Início',r==='home')+it('#/buscar',ic('search',24),'Buscar',r==='buscar')+
  (ME?'<button class="plus" data-a="create" aria-label="Criar"><span>'+ic('plus',24)+'</span></button>':it('#/pedido/'+l,ic('cloche',24),'Pedido',r==='pedido'))+
  it(ME?'#/direct':'#/chat/'+l,ic('msg',24),ME?'Leads':'Mensagens',r==='chat'||r==='direct',n?'<i class="bd">'+n+'</i>':'')+
  (me?it('#/painel',img(me.avatar,'',me.name,''),'Painel',r==='painel'):it('#/entrar',ic('user',24),'Ser Chef',r==='entrar'))+'</div>';
}

function saveProf(k,v){
  const c=chefById(ME);
  if(!c)return;
  c[k]=v.trim();
  if(saveData()) toast('Salvo');
}

function compose(type,data){
  const c=chefById(ME);
  c.gallery.push({id:Date.now(),url:data,caption:'Prato especial'});
  if(saveData()){toast('Foto publicada no portfólio!');S.adm='fotos';location.hash='#/painel';route();}
}

const A={
  tab:el=>{S.tab=el.dataset.v;route();},
  bio:()=>{S.bio=!S.bio;route();},
  city:el=>{S.q=norm(el.dataset.v);$('#q').value=el.dataset.v;$('#res').innerHTML=resHtml();},
  dish:el=>{
    const id=+el.dataset.id, d=S.order.dishes, i=d.indexOf(id);
    i>-1?d.splice(i,1):d.push(id);
    el.classList.toggle('on');
    el.setAttribute('aria-pressed',i<0);
    el.querySelector('.ck').textContent=i<0?'✓':'';
    $('#oc').textContent=d.length?d.length+(d.length===1?' prato':' pratos'):'Nenhum prato escolhido';
    updateOrderState();
  },
  cat:el=>{
    S.cat=el.dataset.v;
    const c=chefById(S.order.chef);
    document.querySelectorAll('[data-a="cat"]').forEach(b=>b.classList.toggle('on',b===el));
    $('#dl').innerHTML=dishList(c);
  },
  step:el=>{
    const o=S.order, w=el.dataset.w;
    o[w]=Math.max(w==='adults'?1:0,o[w]+(+el.dataset.d));
    $(w==='adults'?'#ad':'#kd').textContent=o[w];
  },
  sw:el=>{
    const w=el.dataset.w;
    S.order[w]=!S.order[w];
    el.classList.toggle('on');
    el.setAttribute('aria-pressed',S.order[w]);
  },
  chip:el=>{
    const c=S.order.chips, v=el.dataset.v, i=c.indexOf(v);
    i>-1?c.splice(i,1):c.push(v);
    el.classList.toggle('on');
  },
  sendorder:()=>{
    const f=S.order.f, o=S.order;
    if(!f.name||!f.name.trim()||!f.phone||!f.phone.trim()){toast('Preencha seu Nome e Telefone para continuar');return;}
    if(!o.dishes.length){toast('Escolha ao menos um prato do cardápio');return;}
    sendOrder();
  },
  setname:()=>{
    const v=($('#nm').value||'').trim();
    if(!v){toast('Digite seu nome');return;}
    NAME=v;localStorage.setItem('scf3_name',v);route();
  },
  qr:el=>{$('#ci').value=el.dataset.v;$('#ci').focus();},
  chatsend:()=>{
    if(!NAME){toast('Diga seu nome primeiro');const n=$('#nm');if(n)n.focus();return;}
    const i=$('#ci'), t=i.value.trim();
    if(!t)return;
    MSG.push({chefId:S.last,client:NAME,from:'client',t:Date.now(),text:t,sent:false});
    if(saveData()){i.value='';route();}
  },
  chatwa:()=>{
    const c=chefById(S.last), u=MSG.filter(m=>m.chefId===S.last&&m.client===NAME&&m.from==='client'&&!m.sent);
    if(!u.length){wa(c.whatsapp,'Olá, Chef '+c.name.replace(/^Chef\s+/i,'')+'! Vim pelo Seu Chef em Casa.');return;}
    wa(c.whatsapp,'Olá, '+c.name.replace(/^Chef\s+/i,'Chef ')+'! Aqui é '+NAME+'.\n'+u.map(m=>m.text).join('\n'));
    u.forEach(m=>m.sent=true);saveData();route();
  },
  chefsend:el=>{
    const i=$('#ci'), t=i.value.trim();
    if(!t)return;
    MSG.push({chefId:ME,client:el.dataset.n,from:'chef',t:Date.now(),text:t,sent:true});
    if(saveData()){i.value='';route();}
  },
  authtab:el=>{S.auth=el.dataset.v;S.first=false;route();},
  eye:el=>{
    const i=$('#a_p'), s=i.type==='password';
    i.type=s?'text':'password';
    el.innerHTML=ic(s?'eyeoff':'eye',20);
  },
  login:async()=>{
    const er=m=>{$('#er').textContent=m;}, e=norm($('#a_e').value), p=$('#a_p').value;
    er('');
    if(!e||!p){er('Preencha o e-mail e a senha.');return;}
    if(p.length<6){er('A senha precisa ter ao menos 6 caracteres.');return;}
    if(S.auth==='up'){
      const n=$('#a_n').value.trim(), w=$('#a_w').value.replace(/\D/g,'');
      if(!n){er('Informe seu nome.');return;}
      if(w.length<10){er('Informe o WhatsApp com DDD.');return;}
      if(DB.some(c=>norm(c.email)===e)){er('Este e-mail já está cadastrado.');return;}
      if(p!==$('#a_p2').value){er('As senhas não conferem.');return;}
      const id='c'+Date.now();
      DB.push({id:id,name:/^chef\s/i.test(n)?n:'Chef '+n,email:e,pass:await hp(p,id),whatsapp:w,cities:$('#a_c').value.trim(),avatar:'',bio:'',dishes:[],gallery:[]});
      ME=id;saveData();toast('Conta criada!');S.adm='prof';location.hash='#/painel';return;
    }
    const c=DB.find(x=>norm(x.email)===e);
    if(!c){er('E-mail não encontrado.');return;}
    if(!c.pass){
      if(!S.first){S.first=true;route();return;}
      if(p!==$('#a_p2').value){er('As senhas não conferem.');return;}
      c.pass=await hp(p,c.id);ME=c.id;S.first=false;saveData();toast('Senha criada!');location.hash='#/painel';return;
    }
    if(c.pass!==await hp(p,c.id)){er('Senha incorreta.');return;}
    ME=c.id;saveData();toast('Bem-vindo(a)!');location.hash='#/painel';
  },
  forgot:()=>sheet('<h3 class="c" style="margin-bottom:6px">Redefinir senha</h3><p class="mut c" style="margin-bottom:12px;font-size:14px">Confirme o e-mail e o WhatsApp cadastrados.</p><div class="f"><label for="r_e">E-mail</label><input id="r_e" type="email"></div><div class="f"><label for="r_w">WhatsApp cadastrado</label><input id="r_w" type="tel"></div><div class="f"><label for="r_p">Nova senha</label><input id="r_p" type="password"></div><p class="err" id="r_er"></p><button class="b b1 full" data-a="reset">Redefinir</button>'),
  reset:async()=>{
    const c=DB.find(x=>norm(x.email)===norm($('#r_e').value)), w=$('#r_w').value.replace(/\D/g,''), p=$('#r_p').value;
    if(!c||!c.whatsapp||String(c.whatsapp).replace(/\D/g,'').slice(-8)!==w.slice(-8)||w.length<8){$('#r_er').textContent='E-mail ou WhatsApp não conferem.';return;}
    if(p.length<6){$('#r_er').textContent='Senha curta.';return;}
    c.pass=await hp(p,c.id);saveData();closeSheet();toast('Senha redefinida.');
  },
  logout:()=>{ME=null;saveData();toast('Sessão encerrada.');location.hash='#/';route();},
  create:()=>sheet('<h3 class="c" style="margin-bottom:12px">Painel Rápido</h3><button class="b b1 full" data-a="pick" data-v="feed" style="margin-bottom:10px">'+ic('camera',20)+' Adicionar foto de prato</button><button class="b b2 full" data-a="goMenu">'+ic('menu',20)+' Gerenciar cardápio</button>'),
  goMenu:()=>{closeSheet();S.adm='menu';location.hash='#/painel';route();},
  pick:el=>{S.pick=el.dataset.v;closeSheet();const fi=$('#fi');if(fi)fi.click();},
  adm:el=>{S.adm=el.dataset.v;route();},
  dadd:()=>{
    const n=$('#d_n').value.trim();
    if(!n){toast('Digite o nome do prato');return;}
    const c=chefById(ME);
    c.dishes.push({id:Date.now(),category:$('#d_c').value,name:n,desc:$('#d_d').value.trim(),price:parseFloat(String($('#d_p').value).replace(',','.'))||0});
    saveData();toast('Prato salvo');route();
  },
  ddel:el=>{if(!confirm('Excluir este prato?'))return;const c=chefById(ME);c.dishes=c.dishes.filter(d=>d.id!==+el.dataset.id);saveData();route();},
  pdel:el=>{if(!confirm('Excluir esta foto?'))return;const c=chefById(ME);c.gallery=c.gallery.filter(p=>p.id!==+el.dataset.id);saveData();route();}
};

document.addEventListener('click',e=>{
  if(e.target.id==='ovl'){closeSheet();return;}
  const el=e.target.closest('[data-a]');
  if(!el)return;
  const a=el.dataset.a;
  if(A[a]){if(el.tagName==='A')return;A[a](el,e);}
});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f){S.order.f[t.dataset.f]=t.value;updateOrderState();}
  else if(t.dataset.p){clearTimeout(window.prT);const k=t.dataset.p, v=t.value;window.prT=setTimeout(()=>saveProf(k,v),500);}
  else if(t.id==='q'){S.q=norm(t.value);const res=$('#res');if(res)res.innerHTML=resHtml();}
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeSheet();
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter&&A[e.target.dataset.enter]){e.preventDefault();A[e.target.dataset.enter](e.target,e);}
});

const fi=document.createElement('input');
fi.type='file';fi.accept='image/*';fi.id='fi';fi.hidden=true;
document.body.appendChild(fi);
fi.addEventListener('change',()=>{
  const f=fi.files&&fi.files[0];fi.value='';if(!f)return;
  const p=S.pick;
  compress(f,p==='avatar'?360:1080,.8).then(d=>{
    if(p==='avatar'){chefById(ME).avatar=d;if(saveData()){toast('Foto de perfil atualizada');route();}}
    else compose(p,d);
  }).catch(()=>toast('Não foi possível ler a imagem'));
});

window.addEventListener('hashchange',route);

const logo=$('#logo');if(logo)logo.innerHTML=hat(22);
loadData();
route();

})();
</script>
